title: Systemd timer enabled or scheduled from the command line
id: ca74a188-ab07-42e5-8d46-d1dd1238d904
status: experimental
description: |
  Matches the execution leg of AN0645: a process creation for `systemctl` whose
  command line names a `.timer` unit, or for `systemd-run` carrying one of the
  transient-timer options that schedule a unit without any unit file existing on
  disk at all. The process-creation source is chosen over the same analytic's
  auditd file-creation leg because activation is the step both variants share —
  a `.timer` file written under /etc/systemd/system does nothing until systemd
  is told about it — and because the file leg would record `name=` exactly as it
  was passed to the syscall, so a write from inside the directory logs a bare
  unit name with the directory on an unjoinable CWD record. Two of MITRE's knobs
  cannot be applied inside a single event: `TimerIntervalThreshold` asks whether
  the interval is unusually short, and comparing `--on-active=30s` against a
  threshold is arithmetic Sigma has no operator for, so only the presence of the
  flag is matched; `ParentProcessID` (parent PID 1, i.e. the payload systemd
  later runs) is a second event that Sigma cannot join to this one. The knobs
  `UserContext` and `TimerCreationPath` are deliberately not used as filters
  here, because user-level timers under ~/.config/systemd/user are in scope for
  the technique and filtering to root would drop them. The rule is also evadable
  by design of the mechanism: an operator who writes the unit file and symlinks
  it into timers.target.wants by hand, rather than calling `systemctl enable`,
  produces no matching command line, and a timer whose name does not end in
  `.timer` is not valid systemd, but `systemctl start foo` on the paired service
  is not matched either. Prerequisite, and it has two halves. The rule is
  written in the normalised Linux `process_creation` vocabulary, where `Image`
  and `CommandLine` arrive on one document — Sysmon for Linux EventID 1, or an
  auditd shipper such as auditbeat or Elastic's auditd module that reassembles
  the records. Raw auditd shipped as `product: linux / service: auditd` cannot
  satisfy this rule at all: there the binary is `exe` on the SYSCALL record and
  the arguments are `a0`/`a1` on a separate EXECVE record, so no single record
  carries both halves of either selection and the AND is never true. That feed
  needs the two records joined into one event before this rule matches, not
  more auditing. Second half: none of these sources record execve by default,
  so with an auditd-based shipper the rule returns zero rows until a rule such
  as `-a always,exit -F arch=b64 -S execve -k exec` is loaded, and zero rows
  reads as quiet when it actually means blind.
  UNVERIFIED AS AUTHORED — derived from MITRE ATT&CK DET0231, not hand-written and not tested by its author. Any lab result is on this rule's own page.
references:
  - https://attack.mitre.org/techniques/T1053/006
  - https://attack.mitre.org/detectionstrategies/DET0231
author: Siemphony pipeline (machine-derived from MITRE ATT&CK v19.2)
date: 2026-08-16
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.006
logsource:
  category: process_creation
  product: linux
detection:
  selection_unit_timer:
    Image|endswith: '/systemctl'
    CommandLine|contains: '.timer'
  selection_transient_timer:
    Image|endswith: '/systemd-run'
    CommandLine|contains:
      - '--on-active'
      - '--on-boot'
      - '--on-startup'
      - '--on-unit-active'
      - '--on-unit-inactive'
      - '--on-calendar'
      - '--timer-property'
  condition: 1 of selection*
falsepositives:
  - "Package installation and upgrade. Distribution packages ship their own timers and enable them from postinst scripts — apt-daily.timer, man-db.timer, logrotate.timer, fwupd-refresh.timer and systemd-tmpfiles-clean.timer among them — so every apt or dnf transaction that touches one of those packages runs a matching systemctl command. On a patched estate this is the highest-volume benign source by a wide margin and is why this rule is low rather than medium."
  - "Configuration management convergence. The Ansible systemd and systemd_service modules, Puppet service resources, Chef and Salt all assert timer state by shelling out to systemctl on every run, which produces a match per managed host per run whether or not anything changed."
  - "Read-only inspection by administrators and monitoring agents. The rule reads the image name and the string `.timer` only, so `systemctl status backup.timer`, `systemctl cat backup.timer` and `systemctl is-active backup.timer` match exactly like an enable does, and health-check scripts run those on a schedule."
  - "Legitimate one-shot scheduling with systemd-run. Administrators and provisioning tooling use `systemd-run --on-active=5m` to defer a reboot, a package operation or a maintenance script until a session has ended, and installers use `--on-calendar` to register a first-run maintenance job."
  - "Host build and container provisioning: cloud-init, image bake scripts and Dockerfile-equivalent VM builds enabling the timers a role needs, which produces a burst of matches on every newly created machine."
level: low
