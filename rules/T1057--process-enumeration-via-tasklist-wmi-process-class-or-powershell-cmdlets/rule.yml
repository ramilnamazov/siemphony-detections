title: Process enumeration via tasklist, WMI process class or PowerShell cmdlets
id: a665cc17-d3fe-4041-a108-7fc9e00d2377
status: experimental
description: |
  Matches AN0095's "commands or invokes APIs to enumerate active processes
  (e.g., tasklist.exe, Get-Process, or CreateToolhelp32Snapshot)" using the
  three command-line forms that surface it: tasklist.exe itself, the
  PowerShell Get-Process/Get-CimInstance/Get-WmiObject process cmdlets, and
  wmic.exe invoked against the process class. CreateToolhelp32Snapshot is a
  bare API call with no command-line footprint and is not covered here.
  Sysmon EventID 10 (process_access) was considered and dropped: tasklist.exe
  opens a handle to every enumerated process, but that produces one
  process_access event per running process rather than one event for the
  enumeration itself, and the field this technique would key on
  (GrantedAccess) is already the anchor for unrelated credential-access
  rules, so reusing it here would be noise, not signal. MITRE's
  ParentProcessName and TimeWindow knobs (non-interactive callers, bursty
  discovery) have no equivalent in a single event and are not encoded. The
  brief's only process_creation source for this analytic is Security EventID
  4688, which needs the Audit Process Creation subcategory enabled and the
  separate Include command line in process creation events policy — neither
  is on by default, and without the second policy specifically the
  CommandLine-based arms of this rule match nothing at all.
  UNVERIFIED AS AUTHORED — derived from MITRE ATT&CK DET0034, not hand-written and not tested by its author. Any lab result is on this rule's own page.
references:
  - https://attack.mitre.org/techniques/T1057
  - https://attack.mitre.org/detectionstrategies/DET0034
author: Siemphony pipeline (machine-derived from MITRE ATT&CK v19.2)
date: 2026-08-16
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection_tasklist:
    Image|endswith: '\tasklist.exe'
  selection_ps_cmdlet:
    CommandLine|contains:
      - 'Get-Process'
      - 'Get-CimInstance -ClassName Win32_Process'
      - 'Get-CimInstance Win32_Process'
      - 'Get-WmiObject -Class Win32_Process'
      - 'Get-WmiObject Win32_Process'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains: 'process'
  condition: 1 of selection*
falsepositives:
  - "Remote monitoring and management (RMM) agents and performance-dashboard tools that poll Get-Process, Get-CimInstance Win32_Process or wmic process on a fixed schedule across the whole managed fleet — on a monitored estate this is the loudest and most routine source of matches."
  - "Helpdesk and support staff running tasklist.exe interactively to confirm whether a specific service or application process is running, a standard first troubleshooting step."
  - "Installers and application launchers that call tasklist or Get-Process to check whether an instance of the target application is already running before proceeding."
  - "The wmic arm also matches process-management commands that are not discovery, such as `wmic process where name=... delete` or `wmic process call terminate`, because both share the bare word 'process' with the enumeration form `wmic process list`."
level: low
