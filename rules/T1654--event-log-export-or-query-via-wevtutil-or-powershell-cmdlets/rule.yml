title: Event log export or query via wevtutil or PowerShell cmdlets
id: 3d1aa938-98f5-448d-9f2c-47fc8e6fefa4
status: experimental
description: |
  AN0705 maps Security EventID 4688 onto the process_creation category, which
  is a Sysmon-shaped vocabulary — this rule is written in Security 4688's own
  field set (NewProcessName, CommandLine, ParentProcessName), not Sysmon's
  Image/ParentImage, since the two log sources do not share field names. It
  matches wevtutil's export-log and query-events subcommands, and PowerShell
  or pwsh calling Get-WinEvent or Get-EventLog — the two native ways to pull
  event data described by the analytic. Security 4688 needs Audit Process
  Creation enabled, and CommandLine additionally needs the separate "Include
  command line in process creation events" policy; neither is on by default.
  UNVERIFIED AS AUTHORED — derived from MITRE ATT&CK DET0255, not hand-written and not tested by its author. Any lab result is on this rule's own page.
references:
  - https://attack.mitre.org/techniques/T1654
  - https://attack.mitre.org/detectionstrategies/DET0255
author: Siemphony pipeline (machine-derived from MITRE ATT&CK v19.2)
date: 2026-08-16
tags:
  - attack.discovery
  - attack.t1654
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil:
    NewProcessName|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - 'epl'
      - 'qe'
  selection_ps:
    NewProcessName|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Get-WinEvent'
      - 'Get-EventLog'
  condition: 1 of selection*
falsepositives:
  - "SOC analysts or helpdesk staff running wevtutil qe or Get-WinEvent interactively to triage a specific alert or user-reported incident."
  - "A designated log-shipping or Windows Event Forwarding collector host running a scheduled PowerShell script that calls Get-WinEvent to relay events off-box — legitimate there, but this rule fires on every run."
level: medium
