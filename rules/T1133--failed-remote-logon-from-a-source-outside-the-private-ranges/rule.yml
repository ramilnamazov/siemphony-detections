falsepositives:
  - "Continuous internet background authentication noise against any internet-exposed surface — an RD Gateway, published RDP host, Exchange/OWA, or a VPN concentrator that logs to Windows — from automated scanners and credential-stuffing bots probing default paths rather than targeted activity. On such a host this is the highest-volume match by a wide margin, thousands of events a day, which is why the level is low rather than high."
  - "Remote staff with a stale saved credential after a password change: a phone or laptop mail client retries on every poll from the mobile carrier's or the home ISP's public address, producing a steady stream of network-cleartext 4625 events for a legitimate user until someone updates the saved password."
  - "Cloud-hosted and partner integrations that authenticate from provider-owned public addresses — hybrid identity connectors, external monitoring probes, mail relays and third-party SaaS connectors — all of which are external by this rule's definition and are expected to be there, and which fail routinely on certificate rollover or token expiry."
  - "Organisations that use publicly routable address space on their own internal network, or that route branch offices and site-to-site links over a public-addressed WAN, where an ordinary mistyped password at a desk in a branch office is counted as an external attempt."
level: low
