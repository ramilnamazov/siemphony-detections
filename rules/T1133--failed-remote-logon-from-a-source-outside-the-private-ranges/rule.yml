title: Failed remote logon from a source outside the private ranges
id: b72955d9-02d7-48b8-8cd7-6adb2e313767
status: experimental
description: |
  Matches a failed logon (Security EventID 4625) of type NetworkCleartext (8)
  or RemoteInteractive/RDP (10) whose `IpAddress` falls outside RFC1918, CGNAT
  (100.64.0.0/10), loopback, link-local and IPv6 unique-local space — the
  external-origin leg of AN1004, the one part a single event can carry; the
  failure-count, geolocation and business-hours legs all need aggregation or
  enrichment this corpus's Sigma model cannot express, and a single event here
  cannot distinguish background internet scanning from a targeted attempt.
  LogonType 3 (plain network) was dropped because it also matches ordinary
  internal-service credential failures (SMB, LDAP) unrelated to an external
  remote-access service; 4776 is not used because it carries no source-address
  field and cannot satisfy this rule's external-origin filter. A successful
  external remote-service logon is EventID 4624, which this rule can never
  see, so a quiet result is not evidence that no external access occurred —
  and a VPN/Citrix gateway that re-authenticates on the user's behalf presents
  an internal address, hiding genuinely external attempts that pass through
  it. Prerequisite: 4625 needs the Logon subcategory of Audit Logon auditing
  Failure; where it is off, this rule returns zero rows, which reads as quiet
  but means blind. Addresses in IPv4-mapped IPv6 form (`::ffff:10.0.0.1`) are
  read as external by this filter; add per-estate handling if that form
  appears in your feed.
  UNVERIFIED AS AUTHORED — derived from MITRE ATT&CK DET0354, not hand-written and not tested by its author. Any lab result is on this rule's own page.
references:
  - https://attack.mitre.org/techniques/T1133
  - https://attack.mitre.org/detectionstrategies/DET0354
author: Siemphony pipeline (machine-derived from MITRE ATT&CK v19.2)
date: 2026-08-16
tags:
  - attack.persistence
  - attack.initial-access
  - attack.t1133
logsource:
  product: windows
  service: security
